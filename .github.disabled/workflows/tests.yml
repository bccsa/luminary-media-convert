name: Tests and build

# Every workspace's tests, and a build from a clean checkout.
#
# The build job matters as much as the suites: a developer machine carries stale
# `dist` directories from earlier builds, which hide dependency-order mistakes in
# `build:libs`. Only a checkout with nothing built yet exercises that order.

# Every commit is covered once: pushes to main, and pull requests for everything else.
on:
    push:
        branches:
            - main
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read

# No job here launches Electron, so its ~100 MB postinstall download is skipped —
# it fails intermittently and would only add a failure mode unrelated to the tests.
env:
    ELECTRON_SKIP_BINARY_DOWNLOAD: 1

# A new push supersedes the run it replaces.
concurrency:
    group: tests-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build from a clean checkout
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version-file: api/.node-version
                  cache: 'npm'
                  cache-dependency-path: package-lock.json
            - run: npm ci

            # Everything the packaged app is made of, from nothing: build:bundled
            # runs the shared libraries in dependency order first, then the API and
            # web client. A leftover dist can mask an ordering mistake, which is why
            # this only means something on a clean checkout.
            - name: Build the libraries, API and web client
              run: npm run build:bundled

            # The Electron main process is in no test matrix (it has no tests), so
            # this is the only place its TypeScript is compiled on an ordinary pull
            # request.
            - name: Compile the Electron main process
              run: npm -w app-electron run build

            # Declarations are what consumers type-check against; a library that
            # emits JS but no .d.ts breaks its consumers rather than itself.
            - name: Every library emitted its type declarations
              run: |
                  for lib in hls encode-config segment-editor player-core player-web; do
                    count=$(find "$lib/dist" -name '*.d.ts' 2>/dev/null | wc -l | tr -d ' ')
                    test "$count" -gt 0 || { echo "$lib emitted no .d.ts files"; exit 1; }
                    echo "  ✓ $lib ($count declaration files)"
                  done

    test:
        name: ${{ matrix.workspace }} tests
        runs-on: ubuntu-latest
        strategy:
            # One workspace per job, and never cancel the others: when two suites
            # break, seeing both in one run beats discovering the second tomorrow.
            fail-fast: false
            matrix:
                workspace:
                    [
                        api,
                        hls,
                        encode-config,
                        segment-editor,
                        player-core,
                        player-web,
                        app,
                    ]
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version-file: api/.node-version
                  cache: 'npm'
                  cache-dependency-path: package-lock.json
            - run: npm ci

            # Several suites import a sibling library's built output, so the
            # libraries have to exist before any of them runs.
            - name: Build the shared libraries
              run: npm run build:libs

            # Every suite is `vitest run`; the extra --run is a no-op that keeps the
            # invocation identical across workspaces.
            - name: Run the suite
              run: npm -w ${{ matrix.workspace }} run test -- --run
