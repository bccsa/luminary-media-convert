apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def media3Version = '1.11.1'

android {
    namespace = 'org.bccsa.luminary.spike'
    compileSdk = 36
    defaultConfig {
        applicationId 'org.bccsa.luminary.spike'
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName '0.0.1'
    }
    // The bundled sample stream is served with byte ranges, which needs seekable, uncompressed assets.
    androidResources {
        noCompress += ['m4s', 'mp4', 'm3u8']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation project(':luminary-player')
    // The plugin keeps these as implementation; the spike touches their types directly.
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.activity:activity:1.11.0'
}
