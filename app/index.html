<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
        <meta name="theme-color" content="#0284c7" />
        <title>Luminary Media Convert</title>
        <script>
            (function () {
                try {
                    var k = 'luminary-theme';
                    var p = localStorage.getItem(k);
                    var dark = false;
                    if (p === 'dark') dark = true;
                    else if (p === 'light') dark = false;
                    else
                        dark = window.matchMedia(
                            '(prefers-color-scheme: dark)'
                        ).matches;
                    document.documentElement.classList.toggle('dark', dark);
                } catch (e) {}
            })();
        </script>
    </head>
    <body
        class="min-h-screen font-sans antialiased bg-slate-50 text-slate-950 dark:bg-slate-950 dark:text-slate-100"
    >
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
