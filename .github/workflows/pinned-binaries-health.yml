name: Pinned FFmpeg URLs still resolve

# Checks that every source `ffmpeg-build/build.sh` fetches is reachable: FFmpeg's
# release tarball and its signature, libwebp's tarball, x264's git repository and the
# nv-codec-headers tag.
#
# There is no schedule, because these hosts are archival rather than rolling —
# ffmpeg.org still serves releases back to 0.6, and libwebp's host keeps old versions
# — so a pinned source vanishing on its own is close to impossible. What does happen
# is a wrong pin: a version that was never published, a mistyped digest, a tag that
# does not exist. That arrives in a pull request, which is what this runs on.
#
# `workflow_dispatch` is there to check on demand before cutting a release.
#
# Reachability only. Whether a *newer* version exists is a judgement call: moving a
# pin means re-verifying capabilities, re-checking the nv-codec-headers ceiling and
# re-testing an encode.

on:
    workflow_dispatch:
    pull_request:
        types: [opened, synchronize, reopened]
        paths:
            - ffmpeg-build/versions.sh
            - electron/scripts/check-pinned-urls.mjs
            - .github/workflows/pinned-binaries-health.yml

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version-file: api/.node-version

            # Read the URLs out of the pin table rather than repeating them here.
            # A copy in this file would drift, and a health check that watches the
            # wrong URLs is worse than none.
            - name: Every pinned URL is still reachable
              run: node electron/scripts/check-pinned-urls.mjs
