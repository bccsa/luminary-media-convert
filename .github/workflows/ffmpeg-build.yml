name: Build FFmpeg from source

# Builds the binaries the app ships, from FFmpeg's own signed source, for all three
# targets. See ffmpeg-build/README.md for why we build rather than download.
#
# The split of runners is deliberate:
#   - macOS arm64 and Intel build on their own architectures, so the capability
#     probes test the real thing rather than Rosetta.
#   - Windows cross-compiles on Linux with mingw-w64 — the same choice BtbN made,
#     because MSYS2 is a second world to maintain — and is then *verified on a
#     Windows runner*, since a cross-build cannot be run where it was made.
#
# Not on every push: these are long jobs and the pins change a few times a year.

on:
    workflow_dispatch:
    push:
        # main only. Three targets compiled from source is tens of minutes, and a
        # feature branch touching a pin should not spend that on every push — open
        # the PR, then dispatch a run when the pin is what you want tested.
        branches:
            - main
        paths:
            # The build definition itself. A change to a pin or a configure flag is
            # exactly when "does this still produce a working encoder" is unanswered.
            #
            # This workflow is deliberately not in its own list: editing the checks
            # is not a reason to recompile FFmpeg three ways. Dispatch it by hand.
            - ffmpeg-build/**

permissions:
    contents: read

concurrency:
    group: ffmpeg-build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    mac:
        name: ${{ matrix.target }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Both on Apple Silicon: GitHub offers no Intel macOS image, so
                    # darwin-x64 is cross-compiled on arm64.
                    #
                    # `native` says whether the result can be *run* here. arm64
                    # executes x86_64 binaries only under Rosetta, which a runner may
                    # not have, so the capability and encode steps are skipped rather
                    # than failed when it is absent — a build that cannot be probed is
                    # not the same as a build that is broken.
                    - { target: darwin-arm64, runner: macos-14, native: true }
                    - { target: darwin-x64, runner: macos-14, native: false }
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v5
            - name: Install build tools
              run: brew install nasm pkg-config gnupg
            - name: Build
              run: ./ffmpeg-build/build.sh ${{ matrix.target }}

            # Native on both runners, so the binary can be asked what it supports
            # rather than trusted. These are the same questions FfmpegService asks
            # at start-up to choose its acceleration mode.
            # Rosetta makes the x64 binary runnable on an arm64 runner when it is
            # installed. Probed rather than assumed, and reported either way.
            - name: Can this runner execute the build?
              id: runnable
              run: |
                  if [ "${{ matrix.native }}" = "true" ]; then
                    echo "runnable=true" >> "$GITHUB_OUTPUT"
                  elif /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
                    echo "runnable=true" >> "$GITHUB_OUTPUT"
                    echo "x86_64 binaries run here under Rosetta"
                  else
                    echo "runnable=false" >> "$GITHUB_OUTPUT"
                    echo "::warning::No Rosetta on this runner — ${{ matrix.target }} is built and pinned but NOT capability-tested"
                  fi

            - name: What the build supports
              if: steps.runnable.outputs.runnable == 'true'
              run: |
                  FF=app-electron/bin/${{ matrix.target }}/ffmpeg
                  "$FF" -hide_banner -version | head -1
                  "$FF" -hide_banner -L | sed -n '2,4p'
                  "$FF" -hide_banner -hwaccels
                  for e in h264_videotoolbox aac libwebp mjpeg pcm_s16le; do
                    "$FF" -hide_banner -encoders | grep -qw "$e" || { echo "MISSING encoder $e"; exit 1; }
                  done
                  # The licensing position, asked of the binary rather than assumed:
                  # libx264 is what --enable-gpl gates, and this build has neither.
                  if "$FF" -hide_banner -encoders | grep -qw libx264; then
                    echo "libx264 is present — this is not an LGPL build"; exit 1
                  fi
                  "$FF" -hide_banner -L | grep -q "Lesser" || { echo "banner does not report LGPL"; exit 1; }
                  for f in scale scale_vt tile trim concat fps format crop aresample; do
                    "$FF" -hide_banner -filters | grep -qE " $f +" || { echo "MISSING filter $f"; exit 1; }
                  done
                  echo "all required encoders and filters present"

            # Features, not flags: a configure flag can name a component that the
            # binary cannot actually use, and only writing a file proves otherwise.
            #
            # The source is built from /dev/zero rather than `lavfi`, because
            # --disable-indevs removes lavfi (it lives in libavdevice) — so there is
            # no testsrc in these builds, and this pattern works in Git Bash too.
            - name: Encode something
              if: steps.runnable.outputs.runnable == 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  FF="app-electron/bin/${{ matrix.target }}/ffmpeg"
                  head -c 5760000 /dev/zero > raw.yuv     # 320x240 yuv420p, 50 frames
                  head -c 64000 /dev/zero > raw.pcm       # 2s of 16-bit mono @ 16 kHz
                  # h264_videotoolbox, not libx264: there is no software H.264
                  # encoder in this build at all, which is the whole point of it.
                  "$FF" -hide_banner -loglevel error \
                    -f rawvideo -pix_fmt yuv420p -s 320x240 -r 25 -i raw.yuv \
                    -f s16le -ar 16000 -ac 1 -i raw.pcm \
                    -c:v h264_videotoolbox -c:a aac -shortest src.mp4 -y
                  # HLS with fMP4 segments — what the encoder actually emits.
                  "$FF" -hide_banner -loglevel error -i src.mp4 -c:v h264_videotoolbox -c:a aac \
                    -hls_time 1 -hls_segment_type fmp4 -hls_playlist_type vod \
                    -hls_segment_filename "s_%d.m4s" o.m3u8 -y
                  test -s o.m3u8
                  echo "  HLS fMP4 written with h264_videotoolbox + aac"
                  # Sprite sheet: the tile filter through libwebp.
                  "$FF" -hide_banner -loglevel error -i src.mp4 \
                    -vf "fps=1,scale=160:-1,tile=2x1" -c:v libwebp sp.webp -y
                  test -s sp.webp
                  echo "  libwebp sprite written"
                  # WaveformService's path: raw PCM on stdout.
                  bytes=$("$FF" -hide_banner -loglevel error -i src.mp4 -ac 1 -ar 8000 -f s16le - | wc -c)
                  test "$bytes" -gt 1000
                  echo "  raw PCM out: $bytes bytes"

            - uses: actions/upload-artifact@v4
              with:
                  name: ffmpeg-${{ matrix.target }}
                  path: app-electron/bin/${{ matrix.target }}/
                  retention-days: 7
                  if-no-files-found: error

    windows-cross:
        name: win32-x64 (cross-compiled on Linux)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Install mingw-w64 and build tools
              run: |
                  sudo apt-get update
                  # cmake builds libvpl, the Quick Sync dispatcher. Present on this
                  # image already, named anyway: the job should not depend on what
                  # a runner image happens to carry this month.
                  sudo apt-get install -y mingw-w64 nasm pkg-config gnupg clang cmake
            - name: Build
              run: ./ffmpeg-build/build.sh win32-x64
            - uses: actions/upload-artifact@v4
              with:
                  name: ffmpeg-win32-x64
                  path: app-electron/bin/win32-x64/
                  retention-days: 7
                  if-no-files-found: error

    windows-verify:
        # The cross-build cannot be run where it was made, so a Windows runner asks
        # it what it supports. This is what catches a build that compiles cleanly and
        # has no NVENC — hardware support is a compile-time decision that cannot be
        # added afterwards.
        name: win32-x64 verified on Windows
        needs: windows-cross
        runs-on: windows-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: ffmpeg-win32-x64
                  path: bin
            - name: What the build supports
              shell: bash
              run: |
                  FF=bin/ffmpeg.exe
                  chmod +x bin/*.exe
                  "$FF" -hide_banner -version | head -1
                  "$FF" -hide_banner -L | sed -n '2,4p'
                  "$FF" -hide_banner -hwaccels
                  for e in h264_nvenc h264_qsv aac libwebp mjpeg pcm_s16le; do
                    "$FF" -hide_banner -encoders | grep -qw "$e" || { echo "MISSING encoder $e"; exit 1; }
                  done
                  # The licensing position, asked of the binary rather than assumed:
                  # libx264 is what --enable-gpl gates, and this build has neither.
                  if "$FF" -hide_banner -encoders | grep -qw libx264; then
                    echo "libx264 is present — this is not an LGPL build"; exit 1
                  fi
                  "$FF" -hide_banner -L | grep -q "Lesser" || { echo "banner does not report LGPL"; exit 1; }
                  for f in scale_cuda vpp_qsv scale_qsv; do
                    "$FF" -hide_banner -filters | grep -qE " $f +" || { echo "MISSING filter $f"; exit 1; }
                  done
                  # Presence, which is all this runner can answer: it has neither an
                  # NVIDIA nor an Intel GPU, so no hardware encode can be attempted
                  # here. Whether the encoder was compiled in is the question a
                  # cross-build cannot answer for itself, and it is the one that
                  # cannot be fixed after shipping.
                  "$FF" -hide_banner -hwaccels | grep -qw qsv || { echo "MISSING qsv hwaccel"; exit 1; }
                  echo "NVENC and Quick Sync are present, and no software H.264 encoder is"
            # Features, not flags: a configure flag can name a component that the
            # binary cannot actually use, and only writing a file proves otherwise.
            #
            # The source is built from /dev/zero rather than `lavfi`, because
            # --disable-indevs removes lavfi (it lives in libavdevice) — so there is
            # no testsrc in these builds, and this pattern works in Git Bash too.
            - name: Encode something
              shell: bash
              run: |
                  set -euo pipefail
                  FF="bin/ffmpeg.exe"
                  head -c 5760000 /dev/zero > raw.yuv     # 320x240 yuv420p, 50 frames
                  head -c 64000 /dev/zero > raw.pcm       # 2s of 16-bit mono @ 16 kHz
                  # No H.264 is written here, and that is not an omission. This
                  # runner has neither an NVIDIA nor an Intel GPU, and the build
                  # carries no software H.264 encoder — so every route to H.264 is
                  # absent by design. Their presence was checked above, which is the
                  # question a cross-build cannot answer for itself; that they encode
                  # is answered on real hardware, not here.
                  #
                  # What is provable without a GPU still is: the filter chain, libwebp
                  # and the waveform path, all straight from the raw inputs.
                  "$FF" -hide_banner -loglevel error \
                    -f rawvideo -pix_fmt yuv420p -s 320x240 -r 25 -i raw.yuv \
                    -vf "fps=1,scale=160:-1,tile=2x1" -c:v libwebp sp.webp -y
                  test -s sp.webp
                  echo "  libwebp sprite written through the tile filter"
                  # WaveformService's path: raw PCM on stdout.
                  bytes=$("$FF" -hide_banner -loglevel error \
                    -f s16le -ar 16000 -ac 1 -i raw.pcm -ac 1 -ar 8000 -f s16le - | wc -c)
                  test "$bytes" -gt 1000
                  echo "  raw PCM out: $bytes bytes"
