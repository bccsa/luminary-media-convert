name: "Build & Deploy SaaS to staging"
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - saas/**
      - hls/**
      - package.json
      - package-lock.json
      - .github/workflows/saas-deploy-staging.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  deploy:
    runs-on: [self-hosted, za-scc-dhe03]
    environment: saas-staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Write .env file
        run: |
          cat > saas/.env <<'ENV_EOF'
          PORT=${{ vars.DOCKER_PORT }}
          AUTH0_DOMAIN=${{ vars.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE=${{ vars.AUTH0_AUDIENCE }}
          AUTH0_CLAIM_NAMESPACE=${{ vars.AUTH0_CLAIM_NAMESPACE }}
          CORS_ORIGIN=${{ vars.CORS_ORIGIN }}
          COUCHDB_URL=${{ secrets.COUCHDB_URL }}
          COUCHDB_USERNAME=${{ secrets.COUCHDB_USERNAME }}
          COUCHDB_PASSWORD=${{ secrets.COUCHDB_PASSWORD }}
          COUCHDB_DATABASE=${{ vars.COUCHDB_DATABASE }}
          ENCODING_API_URL=${{ vars.ENCODING_API_URL }}
          ENCODING_API_MASTER_KEY=${{ secrets.ENCODING_API_MASTER_KEY }}
          SAAS_SERVICE_URL=${{ vars.SAAS_SERVICE_URL }}
          WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}
          SESSION_RETENTION_DAYS=${{ vars.SESSION_RETENTION_DAYS }}
          SESSION_EXPIRY_CRON=${{ vars.SESSION_EXPIRY_CRON }}
          S3_UPLOAD_CONCURRENCY=${{ vars.S3_UPLOAD_CONCURRENCY }}
          S3_ENCRYPTION_KEY=${{ secrets.S3_ENCRYPTION_KEY }}
          ENV_EOF

      - name: Build Docker image
        # Tagged by commit as well as `latest`: `latest` is overwritten every
        # deploy, and without an immutable tag the previous image is orphaned and
        # then pruned, leaving nothing to roll back to.
        run: |
          docker build -f saas/Dockerfile . \
            -t ${{ vars.DOCKER_IMAGE }}:${{ github.sha }} \
            -t ${{ vars.DOCKER_IMAGE }}:latest

      - name: Deploy with rollback
        # The running container is parked under -prev rather than destroyed, so a
        # container that refuses to start, or starts and then crashes, restores the
        # previous one instead of leaving the host with nothing serving.
        run: |
          set -uo pipefail
          C='${{ vars.DOCKER_CONTAINER }}'
          IMG='${{ vars.DOCKER_IMAGE }}:${{ github.sha }}'
          PORT='${{ vars.DOCKER_PORT }}'
          PREV="${C}-prev"

          docker rm -f "$PREV" >/dev/null 2>&1 || true
          HAD_PREV=0
          if docker inspect "$C" >/dev/null 2>&1; then
            # Bail before anything is destroyed: past this point "$C" names the new
            # container, which is what makes removing it during rollback safe.
            docker rename "$C" "$PREV" || {
              echo "::error::could not park the running container - aborting, service untouched"
              exit 1
            }
            HAD_PREV=1
            docker stop "$PREV" >/dev/null 2>&1 || true
          fi

          rollback() {
            echo "::error::deploy failed - rolling back to the previous container"
            docker logs --tail 50 "$C" 2>&1 || true
            docker rm -f "$C" >/dev/null 2>&1 || true
            if [ "$HAD_PREV" = 1 ]; then
              docker rename "$PREV" "$C" && docker start "$C" \
                && echo "previous container restored" \
                || echo "::error::rollback failed - service is down"
            else
              echo "::warning::no previous container to restore"
            fi
            exit 1
          }

          docker run -d -p "$PORT":"$PORT" \
            --restart unless-stopped \
            --name="$C" \
            --add-host=host.docker.internal:host-gateway \
            --env-file saas/.env \
            "$IMG" || rollback

          # Judge success on the app answering, not on `docker run` exiting 0.
          # Any HTTP response counts, including 404: routes differ per service and
          # the SaaS docs route is env-gated, so requiring a specific path made the
          # gate reject healthy containers. This asks only "is it serving HTTP".
          for i in $(seq 1 30); do
            if curl -sS -m 3 -o /dev/null "http://localhost:${PORT}/" 2>/dev/null; then
              echo "healthy after $((i * 2))s"
              docker rm -f "$PREV" >/dev/null 2>&1 || true
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$C" 2>/dev/null)" != "true" ]; then
              rollback
            fi
            # No curl on the runner: settle for the container staying up, rather
            # than rolling back a deploy that is probably fine.
            if ! command -v curl >/dev/null 2>&1 && [ "$i" -ge 5 ]; then
              echo "::warning::curl unavailable - accepted on liveness alone"
              docker rm -f "$PREV" >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 2
          done
          rollback

      - name: Retain only the newest image tags
        # Every deploy tags the build with its commit sha and nothing removed the
        # old ones — 25 `lmc-api-staging` tags accumulated in a few days of active
        # work, ~9.5 GB reclaimable. The prune below cannot help: `docker image
        # prune` without `-a` only touches *dangling* images, and every one of
        # these is tagged. That is why the host filled while pruning every deploy.
        #
        # Keeps `latest`, the newest few sha tags as rollback targets, and whatever
        # the running container actually uses — which is not necessarily the newest,
        # if a deploy rolled back. Untagging here leaves the layers dangling, so the
        # prune below reclaims them in the same run.
        if: success()
        run: |
          set -uo pipefail
          IMG='${{ vars.DOCKER_IMAGE }}'
          C='${{ vars.DOCKER_CONTAINER }}'
          KEEP='${{ vars.DOCKER_IMAGE_KEEP || 3 }}'

          IN_USE="$(docker inspect -f '{{.Image}}' "$C" 2>/dev/null || true)"

          # `docker images` lists newest first, so everything past $KEEP is older
          # than the rollback targets worth holding on to.
          docker images --no-trunc --filter=reference="${IMG}:*" \
              --format '{{.ID}} {{.Repository}}:{{.Tag}}' \
            | grep -v ':latest$' \
            | tail -n +$((KEEP + 1)) \
            | while read -r id tag; do
                if [ -n "$IN_USE" ] && [ "$id" = "$IN_USE" ]; then
                  echo "keeping $tag (in use by $C)"
                  continue
                fi
                if docker rmi "$tag" >/dev/null 2>&1; then
                  echo "removed $tag"
                else
                  echo "::warning::could not remove $tag"
                fi
              done

      - name: Reclaim old Docker build cache & dangling images
        # Every deploy runs `docker build`, and Docker never auto-removes the old
        # cache/images — left unchecked they fill the host disk (this is what
        # exhausted the box). Drop dangling images and build cache older than 7
        # days; recent cache is kept so normal deploys stay fast. Never touches
        # running containers, tagged images in use, or volumes/data.
        if: success()
        run: |
          docker image prune -f --filter 'until=168h'
          docker builder prune -f --filter 'until=168h'
