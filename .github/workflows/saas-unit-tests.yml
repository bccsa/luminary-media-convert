name: Run SaaS Unit Tests
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - prod
    paths:
      - saas/**
      - hls/**
      - package.json
      - package-lock.json
      - .github/workflows/saas-unit-tests.yml

env:
  CI: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: saas/.node-version
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build workspace deps (hls)
        run: npm -w hls run build

      - name: Run SaaS unit tests
        run: npm -w saas run test
