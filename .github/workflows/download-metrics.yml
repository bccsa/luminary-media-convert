# Weekly snapshot of release-asset download counts.
#
# The codec-unit exposure argument rests on staying under a volume threshold,
# and an argument about volume needs a contemporaneous record of it. The CSV is
# committed rather than uploaded as an artifact so git history timestamps each
# snapshot independently — artifacts expire, and a record that expires is not
# a record.
#
# NOTE: this file sits in .github.disabled/ with the rest of the workflows, so
# it does not run. Nothing collects download figures until the directory is
# renamed to .github/. Until then, run it by hand:
#
#     GITHUB_TOKEN=$(gh auth token) node scripts/snapshot-downloads.mjs
#
name: Download metrics

on:
    schedule:
        # Mondays, 04:00 UTC. Weekly is enough: the counter is cumulative, so a
        # missed week is a gap in resolution rather than lost data.
        - cron: '0 4 * * 1'
    workflow_dispatch:

# The snapshot is committed back to the repository.
permissions:
    contents: write

jobs:
    snapshot:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v6
              with:
                  node-version: 20

            - name: Snapshot download counts
              env:
                  # Reads this repository's own releases; no extra scope needed.
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node scripts/snapshot-downloads.mjs

            - name: Commit the snapshot
              run: |
                  git config user.name  "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add metrics/downloads.csv
                  # Nothing to commit is the normal case on a repo with no new
                  # downloads that week, and is not a failure.
                  git diff --staged --quiet && echo "no change" && exit 0
                  git commit -m "chore(metrics): download snapshot $(date -u +%Y-%m-%d)"
                  git push
