name: Run API Unit Tests
permissions:
    contents: read

on:
    pull_request:
        types: [opened, synchronize, reopened]
        branches:
            - main
            - prod
        paths:
            - api/**
            - hls/**
            - package.json
            - package-lock.json
            - .github/workflows/api-unit-tests.yml

env:
    CI: true

# Electron's postinstall downloads a ~100 MB binary, and that download is the single
# most common cause of a red run here: "npm error RequestError: socket hang up" from
# node_modules/electron/install.js, which has nothing to do with the code under test.
# None of these jobs launch Electron, so the download is skipped outright rather than
# retried — faster, and it removes the failure mode instead of hiding it.
env:
    ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: api/.node-version
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'npm'
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build workspace deps (hls)
              run: npm -w hls run build

            - name: Run API unit tests
              run: npm -w api run test
