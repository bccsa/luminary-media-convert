name: "Build & Deploy API to production"
permissions:
  contents: read

on:
  push:
    branches: [prod]
    paths:
      - api/**
      - hls/**
      - tusd/**
      - package.json
      - package-lock.json
      - .github/workflows/api-deploy-prod.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  deploy:
    runs-on: [self-hosted, za-scc-dhe03]
    environment: api-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Write .env file
        run: |
          cat > api/.env <<'ENV_EOF'
          PORT=${{ vars.DOCKER_PORT }}
          CORS_ORIGIN=${{ vars.CORS_ORIGIN }}
          WORK_DIR=${{ vars.WORK_DIR }}
          FFMPEG_TIMEOUT_MS=${{ vars.FFMPEG_TIMEOUT_MS }}
          FFMPEG_THREADS=${{ vars.FFMPEG_THREADS }}
          MAX_UPLOAD_SIZE=${{ vars.MAX_UPLOAD_SIZE }}
          S3_UPLOAD_CONCURRENCY=${{ vars.S3_UPLOAD_CONCURRENCY }}
          MASTER_API_KEY=${{ secrets.MASTER_API_KEY }}
          HLS_ENCRYPTION_SEED=${{ secrets.HLS_ENCRYPTION_SEED }}
          KEY_VALIDATION_WEBHOOK_URL=${{ vars.KEY_VALIDATION_WEBHOOK_URL }}
          KEY_VALIDATION_WEBHOOK_TIMEOUT_MS=${{ vars.KEY_VALIDATION_WEBHOOK_TIMEOUT_MS }}
          KEY_VALIDATION_CACHE_TTL_MS=${{ vars.KEY_VALIDATION_CACHE_TTL_MS }}
          AUTHORIZATION_WEBHOOK_URL=${{ vars.AUTHORIZATION_WEBHOOK_URL }}
          AUTHORIZATION_WEBHOOK_TIMEOUT_MS=${{ vars.AUTHORIZATION_WEBHOOK_TIMEOUT_MS }}
          AUTHORIZATION_WEBHOOK_FAIL_MODE=${{ vars.AUTHORIZATION_WEBHOOK_FAIL_MODE }}
          ENV_EOF

      - name: Build Docker image
        run: docker build -f api/Dockerfile . -t ${{ vars.DOCKER_IMAGE }}

      - name: Stop and remove old container
        run: |
          docker stop ${{ vars.DOCKER_CONTAINER }} || true
          docker rm ${{ vars.DOCKER_CONTAINER }} || true

      - name: Run new container
        # Bind-mount a dedicated host directory at /app/work (uploads + FFmpeg
        # encode temp). Without this, large jobs write into the container's
        # overlay layer on the host root disk and exhaust it ("no space left on
        # device" during tus upload / encode). Set the `WORK_DIR_HOST` env var
        # to a large, dedicated disk on the host; ops must ensure it has capacity
        # for max_upload_size x concurrent uploads + encode output. If the var is
        # unset, it falls back to a default path (created on the root disk) so a
        # deploy never breaks — but capacity is only solved once WORK_DIR_HOST
        # points at a big disk.
        run: |
          WORK_DIR_HOST="${{ vars.WORK_DIR_HOST }}"
          docker run -d -p "${{ vars.DOCKER_PORT }}":"${{ vars.DOCKER_PORT }}" \
            --restart unless-stopped \
            --name=${{ vars.DOCKER_CONTAINER }} \
            --add-host=host.docker.internal:host-gateway \
            -v "${WORK_DIR_HOST:-/srv/lmc-work/api-prod}":/app/work \
            --env-file api/.env \
            ${{ vars.DOCKER_IMAGE }}
